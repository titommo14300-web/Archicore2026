<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archicore | نظام الحضور والمرتبات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root{
  --bg:#F8F6F5;
  --surface:#FFFFFF;
  --surface-alt:#F1EEED;
  --surface-alt-2:#E8E3E2;
  --ink:#1C1817;
  --ink-muted:#8A827F;
  --border:#E5DFDD;

  --brand:#D62F2F;
  --brand-dark:#A81F1F;
  --brand-soft:rgba(214,47,47,.08);

  --present:#3FAE72; --present-soft:rgba(63,174,114,.14);
  --absent:#D62F2F; --absent-soft:rgba(214,47,47,.14);
  --late-half:#E2A73B; --late-half-soft:rgba(226,167,59,.14);
  --late-full:#C9701F; --late-full-soft:rgba(201,112,31,.14);
  --permission:#3EC2C2; --permission-soft:rgba(62,194,194,.14);
  --leave:#4C7FDB; --leave-soft:rgba(76,127,219,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:transparent;color:var(--ink);font-family:'IBM Plex Sans Arabic',sans-serif;}
h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--brand-soft);}

.app{display:flex;min-height:100vh;background:var(--bg);}
.sidebar{
  width:222px;flex-shrink:0;background:#FFFFFF;color:var(--ink);
  padding:24px 16px;display:flex;flex-direction:column;gap:6px;border-left:1px solid var(--border);
}
.brand{font-family:'Tajawal',sans-serif;font-weight:800;font-size:20px;margin:4px 4px 4px;line-height:1.3;color:var(--ink);}
.brand .en{direction:ltr;display:inline-block;color:var(--brand);}
.brand small{display:block;font-family:'IBM Plex Sans Arabic';font-weight:400;font-size:12px;color:var(--ink-muted);margin-top:3px;}
.storage-badge{font-size:10.5px;color:var(--ink-muted);background:var(--surface-alt);border:1px solid var(--border);border-radius:20px;padding:4px 10px;margin:8px 4px 20px;display:inline-flex;align-items:center;gap:6px;width:fit-content;}
.storage-dot{width:6px;height:6px;border-radius:50%;background:var(--present);}
.storage-dot.local{background:var(--late-half);}

.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:var(--ink-muted);background:transparent;border:none;text-align:right;font-size:14.5px;font-weight:500;transition:background .15s,color .15s;}
.nav-item:hover{background:var(--surface-alt);color:var(--ink);}
.nav-item.active{background:var(--brand);color:#fff;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;}

.main{flex:1;padding:28px 34px;min-width:0;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:22px;font-weight:800;margin:0;}
.page-sub{color:var(--ink-muted);font-size:13.5px;margin-top:4px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;}
.card-title{font-weight:700;font-size:15.5px;}

.btn{border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-brand{background:var(--brand);color:#fff;}
.btn-brand:hover{background:var(--brand-dark);}
.btn-ghost{background:var(--surface-alt);color:var(--ink);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--surface-alt-2);}
.btn-danger{background:var(--absent-soft);color:var(--absent);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:right;color:var(--ink-muted);font-weight:600;font-size:12px;padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-alt);}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12.5px;color:var(--ink-muted);font-weight:600;}
.field input,.field select{border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;background:var(--surface-alt);color:var(--ink);width:100%;}
.field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand);}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}

.day-cell{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-muted);cursor:pointer;user-select:none;transition:transform .08s;}
.day-cell:hover{transform:scale(1.08);}
.day-cell.present{background:var(--present);color:#fff;border-color:var(--present);}
.day-cell.absent{background:var(--absent);color:#fff;border-color:var(--absent);}
.day-cell.late-half{background:var(--late-half);color:#1B1300;border-color:var(--late-half);}
.day-cell.late-full{background:var(--late-full);color:#fff;border-color:var(--late-full);}
.day-cell.permission{background:var(--permission);color:#04211F;border-color:var(--permission);}
.day-cell.leave{background:var(--leave);color:#fff;border-color:var(--leave);}
.att-grid-wrap{overflow-x:auto;}
.att-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px solid var(--border);}
.att-row:last-child{border-bottom:none;}
.emp-name-col{width:170px;flex-shrink:0;}
.emp-name-col .name{font-weight:700;font-size:14px;}
.emp-name-col .role{font-size:11.5px;color:var(--ink-muted);}
.days-col{display:flex;gap:5px;}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-muted);}
.legend-swatch{width:12px;height:12px;border-radius:4px;}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;}
.stat .num{font-family:'Tajawal';font-weight:800;font-size:24px;color:var(--brand);}
.stat .label{font-size:12.5px;color:var(--ink-muted);margin-top:2px;}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 16px;font-size:17px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}

.empty{text-align:center;padding:40px 20px;color:var(--ink-muted);}
.empty .display{font-size:16px;color:var(--ink);margin-bottom:6px;font-weight:700;}

.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav button{background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;font-size:15px;color:var(--ink);}
.month-nav .m-label{font-weight:700;font-size:14px;min-width:110px;text-align:center;}

.num-input{width:95px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.mono{font-variant-numeric:tabular-nums;}
.net-positive{color:var(--present);font-weight:700;}
small-muted{color:var(--ink-muted);}
.day-popover{position:absolute;z-index:60;background:var(--surface-alt-2);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 28px rgba(0,0,0,.55);min-width:180px;}
.pop-opt{display:flex;align-items:center;gap:8px;background:transparent;border:none;color:var(--ink);text-align:right;padding:8px 10px;border-radius:7px;font-size:13px;width:100%;}
.pop-opt:hover{background:var(--surface-alt);}
.pop-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill-absent{background:var(--absent-soft);color:var(--absent);}
.pill-late{background:var(--late-half-soft);color:var(--late-half);}
.pill-leave{background:var(--leave-soft);color:var(--leave);}
.pill-perm{background:var(--permission-soft);color:var(--permission);}
@media(max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;align-items:center;}
  .brand,.storage-badge{display:none;}
  .main{padding:18px;}
  .emp-name-col{width:110px;}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ---------- storage layer (works inside Claude.ai AND as a standalone local file) ----------
const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage);
async function loadKey(key, fallback){
  if(hasCloudStorage){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
    catch(e){ return fallback; }
  } else {
    try{ const v = localStorage.getItem('archicore:'+key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
}
async function saveKey(key, value){
  if(hasCloudStorage){
    try{ await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ console.error('cloud save failed', key, e); }
  } else {
    try{ localStorage.setItem('archicore:'+key, JSON.stringify(value)); }
    catch(e){ console.error('local save failed', key, e); }
  }
}

// ---------- state ----------
let state = {
  settings: { companyName: 'Archicore', workdays: 30 },
  employees: [],
  attendance: {},   // "empId|YYYY-MM-DD" -> present|absent|late_half|late_full|permission|leave
  extras: {},       // "empId|YYYY-MM" -> {bonus, otherDeduct}
  tab: 'employees',
  attMonth: currentMonthKey(),
  payMonth: currentMonthKey(),
  loaded: false,
};

const STATUS_META = {
  present:    {label:'حاضر',            css:'present',    color:'var(--present)'},
  absent:     {label:'غائب',             css:'absent',     color:'var(--absent)'},
  late_half:  {label:'تأخير (نص يوم)',   css:'late-half',  color:'var(--late-half)'},
  late_full:  {label:'تأخير (يوم كامل)', css:'late-full',  color:'var(--late-full)'},
  permission: {label:'إذن (بدون خصم)',    css:'permission', color:'var(--permission)'},
  leave:      {label:'إجازة',            css:'leave',      color:'var(--leave)'},
};

function currentMonthKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function uid(){ return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fmtMoney(n){ n=Math.round(n*100)/100; return n.toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م'; }
function daysInMonth(monthKey){ const [y,m]=monthKey.split('-').map(Number); return new Date(y,m,0).getDate(); }
function monthLabel(monthKey){
  const [y,m]=monthKey.split('-').map(Number);
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return names[m-1]+' '+y;
}
function shiftMonth(monthKey,delta){
  let [y,m]=monthKey.split('-').map(Number); m+=delta;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  return y+'-'+String(m).padStart(2,'0');
}

async function init(){
  state.settings = await loadKey('app-settings', state.settings);
  state.employees = await loadKey('employees-list', []);
  state.attendance = await loadKey('attendance-map', {});
  state.extras = await loadKey('payroll-extras', {});
  // migrate employees that still have the old yearly leave field
  let migrated = false;
  state.employees = state.employees.map(e=>{
    if(e.monthlyLeave===undefined && e.annualLeave!==undefined){
      migrated = true;
      const {annualLeave, ...rest} = e;
      return {...rest, monthlyLeave: 2};
    }
    return e;
  });
  if(migrated) await saveKey('employees-list', state.employees);
  state.loaded = true;
  render();
}

function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1700);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- calculations ----------
function usedLeaveInMonth(empId, monthKey){
  let count=0;
  Object.keys(state.attendance).forEach(k=>{
    if(k.startsWith(empId+'|') && state.attendance[k]==='leave' && k.split('|')[1].startsWith(monthKey)) count++;
  });
  return count;
}
function calcForEmployee(emp, monthKey){
  const dim=daysInMonth(monthKey);
  const year=monthKey.split('-')[0];
  let present=0,absent=0,lateHalf=0,lateFull=0,permission=0,leave=0;
  for(let d=1; d<=dim; d++){
    const dateStr = monthKey+'-'+String(d).padStart(2,'0');
    const st = state.attendance[emp.id+'|'+dateStr];
    if(st==='present') present++;
    else if(st==='absent') absent++;
    else if(st==='late_half') lateHalf++;
    else if(st==='late_full') lateFull++;
    else if(st==='permission') permission++;
    else if(st==='leave') leave++;
  }
  const workdays = state.settings.workdays||30;
  const dailyRate = (Number(emp.baseSalary)||0)/workdays;
  const absentDeduct = absent*dailyRate;
  const lateDeduct = lateHalf*dailyRate*0.5 + lateFull*dailyRate;
  const ex = state.extras[emp.id+'|'+monthKey] || {bonus:0, otherDeduct:0};
  const bonus = Number(ex.bonus)||0;
  const otherDeduct = Number(ex.otherDeduct)||0;
  const allowances = Number(emp.allowances)||0;
  const gross = (Number(emp.baseSalary)||0) + allowances + bonus;
  const attendanceDeduct = absentDeduct + lateDeduct;
  const totalDeduct = attendanceDeduct + otherDeduct;
  const net = gross - totalDeduct;
  const leaveBalance = Number(emp.monthlyLeave)||0;
  const leaveUsedMonth = leave;
  const leaveRemaining = leaveBalance - leaveUsedMonth;
  return {present,absent,lateHalf,lateFull,permission,leave,dailyRate,absentDeduct,lateDeduct,attendanceDeduct,bonus,otherDeduct,allowances,gross,totalDeduct,net,leaveBalance,leaveUsedMonth,leaveRemaining};
}

// ---------- rendering ----------
function render(){
  const root=document.getElementById('root');
  if(!state.loaded){
    root.innerHTML='<div style="padding:60px;text-align:center;color:#9A928D;font-family:IBM Plex Sans Arabic">جارِ تحميل البيانات…</div>';
    return;
  }
  root.innerHTML = `
    <div class="app">
      <div class="sidebar">
        <div class="brand">${escapeHtml(state.settings.companyName)}<small>نظام الحضور والمرتبات</small></div>
        <div class="storage-badge"><span class="storage-dot ${hasCloudStorage?'':'local'}"></span>${hasCloudStorage?'يُحفظ تلقائيًا في حسابك':'يُحفظ محليًا في هذا المتصفح'}</div>
        ${navItem('employees','الموظفون')}
        ${navItem('attendance','تسجيل الحضور')}
        ${navItem('payroll','كشف المرتبات')}
        ${navItem('settings','الإعدادات')}
      </div>
      <div class="main" id="main"></div>
    </div>
    <div class="toast" id="toast"></div>
  `;
  renderTab();
  bindSidebar();
}
function navItem(key,label){ return `<button class="nav-item ${state.tab===key?'active':''}" data-tab="${key}"><span class="nav-dot"></span>${label}</button>`; }
function bindSidebar(){ document.querySelectorAll('.nav-item').forEach(b=>{ b.onclick=()=>{ state.tab=b.dataset.tab; render(); }; }); }

function renderTab(){
  const main=document.getElementById('main');
  if(state.tab==='employees') main.innerHTML=employeesView();
  else if(state.tab==='attendance') main.innerHTML=attendanceView();
  else if(state.tab==='payroll') main.innerHTML=payrollView();
  else if(state.tab==='settings') main.innerHTML=settingsView();
  bindTabEvents();
}

// ---- Employees ----
function employeesView(){
  const curMonth = currentMonthKey();
  const rows = state.employees.map(e=>{
    const used = usedLeaveInMonth(e.id, curMonth);
    const remaining = (Number(e.monthlyLeave)||0) - used;
    return `<tr>
      <td><b>${escapeHtml(e.name)}</b></td>
      <td>${escapeHtml(e.position||'-')}</td>
      <td class="mono">${fmtMoney(e.baseSalary||0)}</td>
      <td class="mono">${fmtMoney(e.allowances||0)}</td>
      <td class="mono">${Number(e.monthlyLeave)||0} يوم</td>
      <td class="mono" style="color:${remaining<0?'var(--absent)':'var(--present)'}">${remaining} يوم متبقي</td>
      <td><button class="btn btn-ghost btn-sm" data-edit="${e.id}">تعديل</button> <button class="btn btn-danger btn-sm" data-del="${e.id}">حذف</button></td>
    </tr>`;
  }).join('');
  return `
    <div class="topbar">
      <div><h1 class="page-title">الموظفون</h1><div class="page-sub">إدارة بيانات الموظفين، الراتب الأساسي، ورصيد الإجازات الشهري</div></div>
      <button class="btn btn-brand" id="addEmpBtn">+ إضافة موظف</button>
    </div>
    <div class="card">
      ${state.employees.length ? `
      <div style="overflow-x:auto">
      <table><thead><tr><th>الاسم</th><th>الوظيفة</th><th>الراتب الأساسي</th><th>البدلات</th><th>رصيد الإجازة الشهري</th><th>المتبقي هذا الشهر</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
      </div>` : `<div class="empty"><div class="display">لا يوجد موظفون بعد</div>ابدأ بإضافة أول موظف في الشركة</div>`}
    </div>
  `;
}
function empModalHtml(emp){
  emp = emp || {name:'',position:'',baseSalary:'',allowances:0,monthlyLeave:2};
  return `
  <div class="modal-backdrop" id="empModal">
    <div class="modal">
      <h3>${emp.id?'تعديل بيانات موظف':'إضافة موظف جديد'}</h3>
      <div class="grid-form">
        <div class="field"><label>الاسم</label><input id="f-name" value="${escapeHtml(emp.name)}"></div>
        <div class="field"><label>الوظيفة</label><input id="f-position" value="${escapeHtml(emp.position||'')}"></div>
        <div class="field"><label>الراتب الأساسي (شهري)</label><input id="f-salary" type="number" value="${emp.baseSalary||''}"></div>
        <div class="field"><label>بدلات شهرية ثابتة</label><input id="f-allow" type="number" value="${emp.allowances||0}"></div>
        <div class="field"><label>رصيد الإجازة الشهري (يوم)</label><input id="f-leave" type="number" value="${emp.monthlyLeave??2}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-brand" id="saveEmpBtn">حفظ</button>
        <button class="btn btn-ghost" id="cancelEmpBtn">إلغاء</button>
      </div>
    </div>
  </div>`;
}
function openEmpModal(emp){
  document.body.insertAdjacentHTML('beforeend', empModalHtml(emp));
  document.getElementById('cancelEmpBtn').onclick = closeModal;
  document.getElementById('empModal').addEventListener('click', e=>{ if(e.target.id==='empModal') closeModal(); });
  document.getElementById('saveEmpBtn').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    const position = document.getElementById('f-position').value.trim();
    const baseSalary = Number(document.getElementById('f-salary').value)||0;
    const allowances = Number(document.getElementById('f-allow').value)||0;
    const monthlyLeave = Number(document.getElementById('f-leave').value)||0;
    if(!name){ showToast('من فضلك أدخل اسم الموظف'); return; }
    if(emp && emp.id){
      const idx = state.employees.findIndex(x=>x.id===emp.id);
      state.employees[idx] = {...state.employees[idx], name, position, baseSalary, allowances, monthlyLeave};
    } else {
      state.employees.push({id: uid(), name, position, baseSalary, allowances, monthlyLeave});
    }
    await saveKey('employees-list', state.employees);
    closeModal(); render(); showToast('تم الحفظ بنجاح');
  };
}
function closeModal(){ const m=document.getElementById('empModal'); if(m) m.remove(); }

// ---- Attendance ----
function attendanceView(){
  const dim = daysInMonth(state.attMonth);
  const dayNums = Array.from({length:dim},(_,i)=>i+1);
  const rows = state.employees.map(emp=>{
    const cells = dayNums.map(d=>{
      const dateStr = state.attMonth+'-'+String(d).padStart(2,'0');
      const st = state.attendance[emp.id+'|'+dateStr];
      const css = st ? STATUS_META[st].css : '';
      return `<div class="day-cell ${css}" data-emp="${emp.id}" data-date="${dateStr}" title="يوم ${d}${st?' - '+STATUS_META[st].label:''}">${d}</div>`;
    }).join('');
    return `<div class="att-row">
      <div class="emp-name-col"><div class="name">${escapeHtml(emp.name)}</div><div class="role">${escapeHtml(emp.position||'')}</div></div>
      <div class="days-col">${cells}</div>
    </div>`;
  }).join('');
  const legend = Object.entries(STATUS_META).map(([k,v])=>`<div class="legend-item"><span class="legend-swatch" style="background:${v.color}"></span>${v.label}</div>`).join('');
  return `
    <div class="topbar">
      <div><h1 class="page-title">تسجيل الحضور</h1><div class="page-sub">اضغط على أي يوم لاختيار حالة الحضور</div></div>
      <div class="month-nav">
        <button id="attPrev">‹</button>
        <div class="m-label">${monthLabel(state.attMonth)}</div>
        <button id="attNext">›</button>
      </div>
    </div>
    <div class="card">
      ${state.employees.length ? `
      <div class="att-grid-wrap">${rows}</div>
      <div class="legend">${legend}<div class="legend-item"><span class="legend-swatch" style="background:var(--surface-alt);border:1px solid var(--border)"></span>غير مسجل</div></div>
      ` : `<div class="empty"><div class="display">أضف موظفين أولاً</div>انتقل لتبويب "الموظفون" لإضافة فريق العمل</div>`}
    </div>
  `;
}
function openDayPopover(cell){
  closeDayPopover();
  const rect = cell.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className='day-popover'; pop.id='dayPopover';
  pop.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  pop.style.left = Math.max(8, rect.left + window.scrollX - 60) + 'px';
  const opts = Object.entries(STATUS_META).map(([val,meta])=>`<button class="pop-opt" data-val="${val}"><span class="pop-dot" style="background:${meta.color}"></span>${meta.label}</button>`).join('');
  pop.innerHTML = opts + `<button class="pop-opt" data-val=""><span class="pop-dot" style="background:var(--border)"></span>مسح / غير مسجل</button>`;
  document.body.appendChild(pop);
  pop.querySelectorAll('.pop-opt').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const val = btn.dataset.val;
      const key = cell.dataset.emp+'|'+cell.dataset.date;
      if(val) state.attendance[key]=val; else delete state.attendance[key];
      await saveKey('attendance-map', state.attendance);
      closeDayPopover();
      render();
    };
  });
  setTimeout(()=>document.addEventListener('click', outsideClickCloser), 0);
}
function outsideClickCloser(e){
  const pop = document.getElementById('dayPopover');
  if(pop && !pop.contains(e.target)) closeDayPopover();
}
function closeDayPopover(){
  const pop = document.getElementById('dayPopover');
  if(pop) pop.remove();
  document.removeEventListener('click', outsideClickCloser);
}

// ---- Payroll ----
function payrollView(){
  let totalNet=0,totalGross=0,totalDeduct=0;
  const rows = state.employees.map(emp=>{
    const c = calcForEmployee(emp, state.payMonth);
    totalNet+=c.net; totalGross+=c.gross; totalDeduct+=c.totalDeduct;
    return `<tr>
      <td><b>${escapeHtml(emp.name)}</b></td>
      <td class="mono">${fmtMoney(emp.baseSalary||0)}</td>
      <td class="mono">${fmtMoney(c.allowances)}</td>
      <td><span class="pill pill-absent">${c.absent}</span></td>
      <td><span class="pill pill-late" title="نص يوم: ${c.lateHalf} / يوم كامل: ${c.lateFull}">${c.lateHalf}ن + ${c.lateFull}ك</span></td>
      <td><span class="pill pill-perm">${c.permission}</span></td>
      <td><span class="pill pill-leave">${c.leave}</span></td>
      <td class="mono" style="color:${c.leaveRemaining<0?'var(--absent)':'var(--ink-muted)'}">${c.leaveRemaining} متبقي</td>
      <td class="mono" title="خصم غياب: ${fmtMoney(c.absentDeduct)} / خصم تأخير: ${fmtMoney(c.lateDeduct)}">${fmtMoney(c.attendanceDeduct)}</td>
      <td><input class="num-input" type="number" data-bonus="${emp.id}" value="${c.bonus||''}" placeholder="0"></td>
      <td><input class="num-input" type="number" data-other="${emp.id}" value="${c.otherDeduct||''}" placeholder="0"></td>
      <td class="mono net-positive">${fmtMoney(c.net)}</td>
    </tr>`;
  }).join('');
  return `
    <div class="topbar">
      <div><h1 class="page-title">كشف المرتبات</h1><div class="page-sub">يُحسب تلقائيًا من بيانات الحضور المسجلة. إذن وإجازة لا يُخصم منهما راتب.</div></div>
      <div style="display:flex;gap:10px;align-items:center;">
        <div class="month-nav"><button id="payPrev">‹</button><div class="m-label">${monthLabel(state.payMonth)}</div><button id="payNext">›</button></div>
        <button class="btn btn-ghost" id="exportBtn">تصدير CSV</button>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="num mono">${fmtMoney(totalGross)}</div><div class="label">إجمالي المستحق</div></div>
      <div class="stat"><div class="num mono">${fmtMoney(totalDeduct)}</div><div class="label">إجمالي الخصومات</div></div>
      <div class="stat"><div class="num mono">${fmtMoney(totalNet)}</div><div class="label">صافي المرتبات</div></div>
    </div>
    <div class="card">
      ${state.employees.length ? `
      <div style="overflow-x:auto">
      <table><thead><tr>
        <th>الموظف</th><th>الأساسي</th><th>البدلات</th><th>غياب</th><th>تأخير</th><th>إذن</th><th>إجازة</th><th>رصيد الإجازة الشهري</th><th>خصم الحضور</th><th>حافز</th><th>خصم يدوي (ج.م)</th><th>الصافي</th>
      </tr></thead><tbody>${rows}</tbody></table>
      </div>
      <div class="page-sub" style="margin-top:10px">عدّل الحافز أو الخصم اليدوي لأي موظف مباشرة في الجدول، ويُحفظ تلقائيًا. مرّر المؤشر فوق عمودي "تأخير" و"خصم الحضور" لمعرفة التفاصيل.</div>
      ` : `<div class="empty"><div class="display">لا توجد بيانات بعد</div>أضف موظفين وسجّل الحضور لعرض كشف المرتبات</div>`}
    </div>
  `;
}

// ---- Settings ----
function settingsView(){
  const s = state.settings;
  return `
    <div class="topbar"><div><h1 class="page-title">الإعدادات</h1><div class="page-sub">إعدادات عامة والنسخ الاحتياطي</div></div></div>
    <div class="card" style="max-width:480px">
      <div class="card-title" style="margin-bottom:14px">إعدادات عامة</div>
      <div class="grid-form">
        <div class="field"><label>اسم الشركة</label><input id="s-name" value="${escapeHtml(s.companyName)}"></div>
        <div class="field"><label>أيام العمل في الشهر</label><input id="s-workdays" type="number" value="${s.workdays}"></div>
      </div>
      <button class="btn btn-brand" id="saveSettingsBtn" style="margin-top:16px">حفظ الإعدادات</button>
      <div class="page-sub" style="margin-top:10px">قيمة اليوم الواحد = الراتب الأساسي ÷ أيام العمل بالشهر. التأخير نص يوم يخصم نصف هذه القيمة، والتأخير يوم كامل يخصمها بالكامل.</div>
    </div>
    <div class="card" style="max-width:480px">
      <div class="card-title" style="margin-bottom:10px">النسخ الاحتياطي</div>
      <div class="page-sub" style="margin-bottom:14px">
        البيانات تُحفظ تلقائيًا ${hasCloudStorage?'في حسابك على Claude':'في هذا المتصفح فقط'}. الحفظ من متصفح لمتصفح أو من جهاز لجهاز غير مباشر تقنيًا في صفحة ويب مستقلة — لذلك أضفنا نسخة احتياطية بملف واحد تقدر تنزّله وتستورده وقت ما تحب، أو تحتفظ بيه كأرشيف.
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="exportBackupBtn">تنزيل نسخة احتياطية</button>
        <label class="btn btn-ghost" style="cursor:pointer">استيراد نسخة احتياطية<input type="file" accept="application/json" id="importBackupInput" style="display:none"></label>
      </div>
    </div>
  `;
}

// ---------- events per tab ----------
function bindTabEvents(){
  if(state.tab==='employees'){
    document.getElementById('addEmpBtn').onclick = ()=>openEmpModal(null);
    document.querySelectorAll('[data-edit]').forEach(b=>{ b.onclick=()=>openEmpModal(state.employees.find(e=>e.id===b.dataset.edit)); });
    document.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('هل تريد حذف هذا الموظف؟ سيتم حذف سجلات حضوره أيضًا.')) return;
        const id = b.dataset.del;
        state.employees = state.employees.filter(e=>e.id!==id);
        Object.keys(state.attendance).forEach(k=>{ if(k.startsWith(id+'|')) delete state.attendance[k]; });
        Object.keys(state.extras).forEach(k=>{ if(k.startsWith(id+'|')) delete state.extras[k]; });
        await saveKey('employees-list', state.employees);
        await saveKey('attendance-map', state.attendance);
        await saveKey('payroll-extras', state.extras);
        render(); showToast('تم حذف الموظف');
      };
    });
  }
  else if(state.tab==='attendance'){
    document.getElementById('attPrev').onclick=()=>{ state.attMonth=shiftMonth(state.attMonth,-1); render(); };
    document.getElementById('attNext').onclick=()=>{ state.attMonth=shiftMonth(state.attMonth,1); render(); };
    document.querySelectorAll('.day-cell').forEach(cell=>{
      cell.onclick = (e)=>{ e.stopPropagation(); openDayPopover(cell); };
    });
  }
  else if(state.tab==='payroll'){
    document.getElementById('payPrev').onclick=()=>{ state.payMonth=shiftMonth(state.payMonth,-1); render(); };
    document.getElementById('payNext').onclick=()=>{ state.payMonth=shiftMonth(state.payMonth,1); render(); };
    document.getElementById('exportBtn').onclick = exportCsv;
    document.querySelectorAll('[data-bonus]').forEach(inp=>{
      inp.onchange = async ()=>{
        const empId=inp.dataset.bonus, key=empId+'|'+state.payMonth;
        state.extras[key] = state.extras[key] || {bonus:0,otherDeduct:0};
        state.extras[key].bonus = Number(inp.value)||0;
        await saveKey('payroll-extras', state.extras); render();
      };
    });
    document.querySelectorAll('[data-other]').forEach(inp=>{
      inp.onchange = async ()=>{
        const empId=inp.dataset.other, key=empId+'|'+state.payMonth;
        state.extras[key] = state.extras[key] || {bonus:0,otherDeduct:0};
        state.extras[key].otherDeduct = Number(inp.value)||0;
        await saveKey('payroll-extras', state.extras); render();
      };
    });
  }
  else if(state.tab==='settings'){
    document.getElementById('saveSettingsBtn').onclick = async ()=>{
      state.settings.companyName = document.getElementById('s-name').value.trim() || 'Archicore';
      state.settings.workdays = Number(document.getElementById('s-workdays').value)||30;
      await saveKey('app-settings', state.settings);
      render(); showToast('تم حفظ الإعدادات');
    };
    document.getElementById('exportBackupBtn').onclick = exportBackup;
    document.getElementById('importBackupInput').onchange = (e)=>{
      const file = e.target.files[0];
      if(file) importBackupFile(file);
    };
  }
}

function exportCsv(){
  const header = ['الموظف','الأساسي','البدلات','غياب','تأخير نص يوم','تأخير يوم كامل','إذن','إجازة','رصيد الإجازة المتبقي','خصم الحضور','حافز','خصم يدوي','الصافي'];
  const lines = [header.join(',')];
  state.employees.forEach(emp=>{
    const c = calcForEmployee(emp, state.payMonth);
    lines.push([emp.name, emp.baseSalary||0, c.allowances, c.absent, c.lateHalf, c.lateFull, c.permission, c.leave, c.leaveRemaining, c.attendanceDeduct.toFixed(2), c.bonus, c.otherDeduct, c.net.toFixed(2)].join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`مرتبات-${state.payMonth}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

function exportBackup(){
  const data = { settings: state.settings, employees: state.employees, attendance: state.attendance, extras: state.extras, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = `نسخة-احتياطية-${state.settings.companyName}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('تم تنزيل النسخة الاحتياطية');
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.employees)) throw new Error('invalid');
      state.settings = data.settings || state.settings;
      state.employees = data.employees || [];
      state.attendance = data.attendance || {};
      state.extras = data.extras || {};
      await saveKey('app-settings', state.settings);
      await saveKey('employees-list', state.employees);
      await saveKey('attendance-map', state.attendance);
      await saveKey('payroll-extras', state.extras);
      render(); showToast('تم استيراد النسخة الاحتياطية بنجاح');
    }catch(err){ showToast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}

init();
</script>
</body>
